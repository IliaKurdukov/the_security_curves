name: Update Analytics Dashboard

on:
  schedule:
    # Каждый день в 00:00 UTC (03:00 МСК)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Даем права на запись
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib requests numpy
        
    - name: Update analytics in README
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/update_analytics.py
        
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Настройка git
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        # Проверяем есть ли изменения в README.md
        if git diff --quiet README.md; then
          echo "Нет изменений в README.md"
        else
          # Коммитим и пушим
          git add README.md
          git commit -m "📊 Обновление аналитики $(date +'%Y-%m-%d')"
          git push
          echo "Изменения закоммичены"
        fi
