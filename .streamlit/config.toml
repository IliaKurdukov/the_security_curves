# Конфиг Streamlit для этого проекта.
# secrets.toml сюда же кладётся локально, но в git не попадает (.gitignore).

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#1a1a1a"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
